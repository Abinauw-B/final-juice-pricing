# ==============================================================================
# Production Environment Profile: application-prod.yml
# Strict Enterprise Production Security, Resiliency, & Performance Configuration
# ==============================================================================

server:
  port: ${PORT:${SERVER_PORT:8088}}
  shutdown: graceful
  tomcat:
    threads:
      max: ${TOMCAT_MAX_THREADS:200}
      min-spare: 25
    max-connections: 10000
    accept-count: 1000

spring:
  application:
    name: retail-pos-backend-prod
  lifecycle:
    timeout-per-shutdown-phase: 30s
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:retailposdb}}
    driver-class-name: org.postgresql.Driver
    username: ${DATABASE_USERNAME:${DB_USERNAME:postgres}}
    password: ${DATABASE_PASSWORD:${DB_PASSWORD:postgres}}
    hikari:
      # Sized safely for 2-4 replicas: 4 replicas * 25 connections = 100 connections max
      maximum-pool-size: ${SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE:25}
      minimum-idle: ${SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE:5}
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      pool-name: RetailPosHikariProdPool
  data:
    redis:
      url: ${REDIS_URL:}
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    # STRICT PRODUCTION IMMUTABILITY: Never drop database schema on validation errors
    clean-disabled: true
    clean-on-validation-error: false
    locations: classpath:db/migration

jwt:
  # Mandatory in production — JwtTokenProvider fails startup if missing or default
  secret: ${JWT_SECRET:}
  expiration-ms: 86400000
  refresh-expiration-ms: 604800000

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:${APP_CORS_ALLOWED_ORIGINS:https://final-juice-pricing-admin.vercel.app,https://final-juice-pricing.vercel.app}}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized
  health:
    redis:
      enabled: false

# Production Safety: Live autonomous trading simulation strictly disabled
market:
  simulator:
    enabled: false

pricing:
  settlement-interval-seconds: 60
  settlement-interval-ms: 60000
  price-decrease-step: 1.00
  round:
    interval-ms: 60000
  default-target-orders: 5
  default-volatility: 0.08
  market-crash:
    duration-ms: 180000
    floor-buffer-percent: 0.05
  engine:
    enabled: true
    interval-ms: 60000
  demand:
    window-minutes: 1
    target-orders: 5
  weight:
    demand: 0.45
    inventory: 0.30
    momentum: 0.15
    time: 0.10
  idle-decay-percent: 4
  max-change-percent: 10
  # Production Safety: Random crashes strictly disabled; manual admin crash retained
  crash:
    enabled: false
    probability: 0.00
    multiplier: 0.55
  minimum-change-percent: 1

logging:
  level:
    root: INFO
    com.retailpos: INFO
    org.springframework.security: WARN
    org.springframework.web: WARN
    org.hibernate: WARN
    com.zaxxer.hikari: INFO
