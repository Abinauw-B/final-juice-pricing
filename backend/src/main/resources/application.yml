server:
  port: ${PORT:${SERVER_PORT:8088}}
  tomcat:
    threads:
      max: ${TOMCAT_MAX_THREADS:300}
      min-spare: 50
    max-connections: 10000
    accept-count: 1000

spring:
  application:
    name: retail-pos-backend
  datasource:
    url: ${DATABASE_URL:${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:retailposdb}}}
    driver-class-name: org.postgresql.Driver
    username: ${DATABASE_USERNAME:${DB_USERNAME:postgres}}
    password: ${DATABASE_PASSWORD:${DB_PASSWORD:postgres}}
    hikari:
      maximum-pool-size: ${SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE:100}
      minimum-idle: ${SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE:20}
      connection-timeout: 60000
      idle-timeout: 600000
      max-lifetime: 1800000
  data:
    redis:
      url: ${REDIS_URL:}
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true
    clean-disabled: false
    clean-on-validation-error: true
    locations: classpath:db/migration

jwt:
  secret: ${JWT_SECRET:PubExchangeSuperSecretKeyForJWTAuth2026EnterpriseProductionEngine!}
  expiration-ms: 86400000

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:${APP_CORS_ALLOWED_ORIGINS:https://final-juice-pricing-admin.vercel.app,https://final-juice-pricing.vercel.app,http://localhost:8000,http://localhost:8001,http://localhost:8002}}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

pricing:
  settlement-interval-seconds: 60
  settlement-interval-ms: 60000
  price-decrease-step: 4.00
  round:
    interval-ms: 60000
  default-target-orders: 5
  default-volatility: 0.08
  market-crash:
    duration-ms: 180000
    floor-buffer-percent: 0.05
  engine:
    enabled: true
    interval-ms: 60000
  demand:
    window-minutes: 1
    target-orders: 5
  weight:
    demand: 0.45
    inventory: 0.30
    momentum: 0.15
    time: 0.10
  idle-decay-percent: 4
  max-change-percent: 10
  crash:
    enabled: true
    probability: 0.03
    multiplier: 0.55
  minimum-change-percent: 1
