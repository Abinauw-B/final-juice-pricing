server:
  port: 8088

spring:
  application:
    name: retail-pos-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/retailposdb}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true
    clean-disabled: false
    clean-on-validation-error: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

pricing:
  engine:
    enabled: true
    interval-ms: 60000
  demand:
    window-minutes: 5
    target-orders: 10
  weight:
    demand: 0.45
    inventory: 0.30
    momentum: 0.15
    time: 0.10
  idle-decay-percent: 4
  max-change-percent: 10
  crash:
    enabled: true
    probability: 0.03
    multiplier: 0.55
  minimum-change-percent: 1

