<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Pub Exchange Cross-Origin Communication Bridge</title>
</head>
<body>
  <script>
    const bc = new BroadcastChannel('pubexchange_market_channel');

    // 1. Forward events from Port 8000 BroadcastChannel to Admin Panel (Port 8001 parent window)
    bc.onmessage = (event) => {
      if (!event.data) return;
      if (window.parent && window.parent !== window) {
        window.parent.postMessage(event.data, '*');
      }
    };

    // 2. Handle postMessages sent down from Admin Panel into this iframe
    window.addEventListener('message', (event) => {
      if (!event.data || !event.data.type) return;

      const { type, payload } = event.data;

      // Handle custom product storage sync on Port 8000 origin
      if (type === 'NEW_FLAVOUR_ADDED' && payload?.product) {
        const cp = payload.product;
        const customProds = JSON.parse(localStorage.getItem('pubexchange_custom_products') || '[]');
        const idx = customProds.findIndex(p => p.id === cp.id || (p.name && cp.name && p.name.toLowerCase() === cp.name.toLowerCase()));
        if (idx !== -1) {
          customProds[idx] = { ...customProds[idx], ...cp };
        } else {
          customProds.push(cp);
        }
        localStorage.setItem('pubexchange_custom_products', JSON.stringify(customProds));
      }

      if (type === 'PRODUCT_PRICE_UPDATE' && payload) {
        const customProds = JSON.parse(localStorage.getItem('pubexchange_custom_products') || '[]');
        let cp = customProds.find(p => p.id === payload.productId || (p.name && payload.flavourName && p.name.toLowerCase() === payload.flavourName.toLowerCase()));
        if (cp) {
          if (payload.flavourName) cp.name = payload.flavourName;
          if (payload.startPrice) {
            cp.basePrice = payload.startPrice;
            cp.currentCupPrice = payload.startPrice;
          }
          if (payload.minPrice) cp.minCupPrice = payload.minPrice;
          if (payload.maxPrice) cp.maxCupPrice = payload.maxPrice;
          if (payload.finalPrice) cp.currentCupPrice = payload.finalPrice;
          localStorage.setItem('pubexchange_custom_products', JSON.stringify(customProds));
        }

        const dynamicProds = JSON.parse(localStorage.getItem('pubexchange_dynamic_products') || '[]');
        let dp = dynamicProds.find(p => p.id === payload.productId || (p.name && payload.flavourName && p.name.toLowerCase() === payload.flavourName.toLowerCase()));
        if (dp) {
          if (payload.finalPrice) dp.currentCupPrice = payload.finalPrice;
          if (payload.startPrice) dp.basePrice = payload.startPrice;
          if (payload.minPrice) dp.minCupPrice = payload.minPrice;
          if (payload.maxPrice) dp.maxCupPrice = payload.maxPrice;
        } else if (payload.productId || payload.flavourName) {
          dynamicProds.push({
            id: payload.productId || Date.now(),
            name: payload.flavourName || 'Juice Flavour',
            currentCupPrice: payload.finalPrice != null ? payload.finalPrice : (payload.startPrice != null ? payload.startPrice : 25),
            basePrice: payload.startPrice != null ? payload.startPrice : 25,
            minCupPrice: payload.minPrice != null ? payload.minPrice : 20,
            maxCupPrice: payload.maxPrice != null ? payload.maxPrice : 30
          });
        }
        localStorage.setItem('pubexchange_dynamic_products', JSON.stringify(dynamicProds));
      }

      if (type === 'BATCH_PRODUCT_PRICE_UPDATED' && payload?.products) {
        localStorage.setItem('pubexchange_dynamic_products', JSON.stringify(payload.products));
      }

      if (type === 'MARKET_CRASH_TRIGGER' && payload?.floorPrice) {
        localStorage.setItem('pubexchange_market_crash_floor', payload.floorPrice.toString());
        localStorage.setItem('pubexchange_market_crash_active', 'true');
        localStorage.setItem('pubexchange_market_crash_end_time', (Date.now() + (payload.durationSeconds || 180) * 1000).toString());
      }

      if (type === 'MARKET_CRASH_STOP') {
        localStorage.removeItem('pubexchange_market_crash_active');
        localStorage.removeItem('pubexchange_market_crash_end_time');
      }

      // Broadcast on port 8000 origin channel
      bc.postMessage({ type, payload });
    });

    // 3. Listen to Port 8000 storage events and notify parent Admin Panel
    window.addEventListener('storage', (e) => {
      if (e.key === 'pubexchange_pos_order' && e.newValue) {
        try {
          const payload = JSON.parse(e.newValue);
          if (window.parent && window.parent !== window) {
            window.parent.postMessage({ type: 'POS_ORDER_COMPLETED', payload }, '*');
          }
        } catch (err) {}
      }
    });
  </script>
</body>
</html>
